<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030a06">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pong Duo — 1P vs AI or 2P Local</title>
<style>
:root{--c1:#33ff66;--c2:#33ff66;--bg:#030a06;--mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:radial-gradient(1000px 600px at 50% -10%,#0a2415 0%,var(--bg) 60%) fixed,var(--bg);color:#c9ffd9;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;overflow:hidden}
#wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
#top{width:min(860px,96vw);display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--mono);font-weight:900;letter-spacing:.14em;font-size:clamp(14px,2.6vw,20px)}
.logo span{color:var(--c2)}
#verBadge{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--c1);border:1px solid #33ff6666;border-radius:6px;padding:3px 10px;white-space:nowrap}
#score{font-family:var(--mono);font-weight:900;font-variant-numeric:tabular-nums;font-size:clamp(18px,3.4vw,28px)}
#mode{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
#rally{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--c1);opacity:.9}
#stage{position:relative;width:min(860px,96vw);aspect-ratio:800/500;border-radius:16px;overflow:hidden;border:1px solid #33ff6633;background:#030a06}
canvas{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(3,10,6,.85);backdrop-filter:blur(6px);padding:14px}
.card{width:min(440px,93%);background:#04140a;border:1px solid #33ff6633;border-radius:16px;padding:20px;text-align:center;max-height:94%;overflow:auto}
#mbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5}
#pveil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,10,6,.85);backdrop-filter:blur(6px);padding:14px}
#pveil .card{width:min(340px,92%)}
#mbtns button{width:42px;height:42px;min-width:42px;padding:0;margin:0;border-radius:10px;background:#000000aa;color:#fff;box-shadow:none;border:1px solid #ffffff44;flex:none;display:flex;align-items:center;justify-content:center}
.card h1{margin:.2em 0;font-size:22px;font-family:var(--mono);letter-spacing:.04em}
.card p{font-size:13px;opacity:.85;line-height:1.6}
.row{display:flex;gap:8px;margin-top:8px}
#stub{display:flex;align-items:center;gap:10px;margin:14px 0 2px;color:var(--c1);font-family:var(--mono);font-size:11px;letter-spacing:.2em}
#stub::before,#stub::after{content:"";flex:1;border-top:2px dashed #ffffff33}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#04121a;background:var(--c1);box-shadow:none;flex:1}
button.pink{background:var(--c2);color:#1a0412}
button.ghost{background:#ffffff14;color:#fff;box-shadow:none;border:1px solid #ffffff2a;flex:1}
button svg{vertical-align:-3px}
button.sel{outline:2px solid #fff}
#hint{font-size:12px;opacity:.65;text-align:center;line-height:1.6}
kbd{font-family:var(--mono);background:#ffffff1a;border:1px solid #ffffff2e;border-radius:6px;padding:1px 6px;font-size:11px}
/* portrait phones (390x844 etc): top-start + internal scroll, wrapped header, full-width stage, wrappable hint, 44px targets */
@media (orientation:portrait){
  body{touch-action:pan-y}
  #wrap{justify-content:flex-start;overflow-y:auto;touch-action:pan-y}
  #top{flex-wrap:wrap;row-gap:4px;width:98vw}
  .logo{font-size:15px;max-width:98vw;overflow-wrap:anywhere}
  #verBadge{font-size:10px;padding:2px 8px}
  #score{font-size:20px}
  #mode{max-width:98vw;overflow-wrap:anywhere}
  #stage{width:98vw;border-radius:10px}
  #hint{font-size:11px;line-height:1.5;white-space:normal;overflow-wrap:anywhere;max-width:98vw}
  .card{width:94vw;max-height:92dvh;overflow:auto}
  .card button,#overlay button{min-height:44px}
  #pveil .card{max-height:92dvh;overflow:auto}
}
@media (max-width:520px){
  .logo{font-size:14px;letter-spacing:.08em}
  .card h1{font-size:19px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div class="logo">PONG <span>DUO</span></div><div id="verBadge">v1.94</div><!-- bump on every update, like the server VERSIONs --><div id="score">0 : 0</div></div>
  <div id="rally">RALLY 0</div>
  <div id="mode">menu</div>
  <div id="stage">
    <canvas id="cv" width="800" height="500"></canvas>
    <div id="mbtns"><button id="pauseBtn" title="Pause"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button><button id="menuBtn" title="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="muteBtn" title="Mute"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div>
    <div id="overlay"><div class="card">
      <h1>🏓 PONG DUO</h1>
      <p>Play <b>alone vs AI</b> or <b>2 players, one keyboard</b>. First to 7, win by 2.</p>
      <div class="row">
        <button id="b1p">🤖 1 Player</button>
        <button id="b2p" class="pink">👥 2 Players</button>
      </div>
      <div class="row" id="diffRow">
        <button data-d="easy" class="ghost">Easy</button>
        <button data-d="medium" class="ghost sel">Medium</button>
        <button data-d="hard" class="ghost">Hard</button>
      </div>
      <p style="margin-top:10px">P1: <kbd>W</kbd>/<kbd>S</kbd> &nbsp;•&nbsp; P2: <kbd>↑</kbd>/<kbd>↓</kbd> &nbsp;•&nbsp; touch: left/right half drag</p>
      <div id="stub"><span>ADMIT ONE</span></div>
      <div class="row"><button id="startBtn">Start</button></div>
      <div id="arcRow" style="margin:8px 0 0;font-size:13px;text-align:left"><span id="arcWho"></span><span id="arcEdit"><input id="arcName" maxlength="12" placeholder="arcade name…" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ffffff33;background:#04140a;color:#fff;font-size:14px;outline:none;margin-top:6px;user-select:text;-webkit-user-select:text"><button id="arcSave" class="ghost" style="width:100%;margin-top:6px">Save name</button><div id="arcMsg" style="font-size:11px;opacity:.75;min-height:16px;margin-top:4px"></div></span></div>
      <div id="lbLine" style="font-size:11px;opacity:.7;margin-top:6px;line-height:1.6"></div>
      <div style="margin-top:10px;font-size:12px;opacity:.7"><a href="https://benjooyt.github.io/browser-games/" target="_blank" rel="noopener" style="color:inherit">more games →</a></div>
    </div></div>
  </div>
  <div id="hint"><kbd>Space</kbd> launch / pause • first to 7, win by 2 (cap 11) • <span id="hintMode">pick a mode above</span></div>
  <div id="pveil"><div class="card">
    <h1>⏸ PAUSED</h1>
    <div class="row"><button id="resumeBtn">Resume</button></div>
    <div class="row"><button id="restartBtn" class="ghost">Restart match</button></div>
    <div class="row"><button id="quitBtn" class="ghost">Quit to menu</button></div>
    <div class="row"><button id="pmuteBtn" class="ghost">Mute: off</button></div>
  </div></div>
</div>
<script>
// 🌍 global board: arcade-site scores only (benjooyt.github.io), one shared name
const SUPA_URL='https://sdmzslvdbontnjculyt.supabase.co',SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkbXpzbHZkYm9udG5qeGN1bHl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4Mzc3MjUsImV4cCI6MjEwNjQxMzcyNX0.01-T2NJHDn4uoWShVM_k2fpjNurPtHzULyCNYuBVfJQ';
const LB_GAME='pongduo',LB_ASC=false;
const LB_Q=new URLSearchParams(location.search);
const LB_ON=/(^|\.)benjooyt\.github\.io$/.test(location.hostname)||LB_Q.has('lbtest');
const LB_API=LB_Q.get('lbapi')||SUPA_URL; // test hook: ?lbtest&lbapi=http://127.0.0.1:8765
function lbName(){try{return localStorage.getItem('arcade_name')||'';}catch(e){return '';}}
function lbHeads(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
async function lbTaken(name){
  try{
    const r=await fetch(LB_API+'/rest/v1/scores?name=eq.'+encodeURIComponent(name)+'&select=id&limit=1',{headers:lbHeads()});
    const j=await r.json();return Array.isArray(j)&&j.length>0;
  }catch(e){return false;}
}
async function lbSetName(name){
  name=String(name||'').trim().slice(0,12);
  if(!name)return{ok:false,reason:'empty'};
  const old=lbName();
  if(old!==name){
    let taken=false;try{taken=await lbTaken(name);}catch(e){taken=false;}
    if(taken)return{ok:false,reason:'taken'};
    if(old){try{await fetch(LB_API+'/rest/v1/scores?name=eq.'+encodeURIComponent(old),{method:'DELETE',headers:lbHeads()});}catch(e){}}
  }
  try{localStorage.setItem('arcade_name',name);}catch(e){}
  return{ok:true};
}
async function lbPost(value){
  if(!LB_ON)return;const name=lbName();if(!name)return;
  try{
    value=Math.max(0,Math.min(1000000,Math.round(value|0)));if(!(value>=0))return;
    const r=await fetch(LB_API+'/rest/v1/scores',{method:'POST',headers:Object.assign(lbHeads(),{'Prefer':'return=minimal'}),body:JSON.stringify({game:LB_GAME,name,value})});
    if(!r.ok){lbFail('post '+r.status);return;}
    try{const el=document.getElementById('lbLine');if(el&&el._fmt){const rows=await lbTop(5);lbRender(el,rows,el._fmt);}}catch(e){}
  }catch(e){lbFail('post offline');}
}
function lbFail(what){
  try{const el=document.getElementById('lbLine');if(el&&LB_ON)el.textContent='global board error ('+what+') — scores not saving';}catch(e){}
}
async function lbTop(n){
  if(!LB_ON)return[];
  try{
    n=n||5;
    const r=await fetch(LB_API+'/rest/v1/scores?game=eq.'+encodeURIComponent(LB_GAME)+'&select=name,value&order=value.'+(LB_ASC?'asc':'desc')+'&limit='+n+'&_='+Date.now(),{headers:lbHeads()});
    if(!r.ok){lbFail('read '+r.status);return[];}
    const j=await r.json();return Array.isArray(j)?j:[];
  }catch(e){return[];}
}
function lbRender(el,rows,fmt){
  if(!el)return;
  try{el._fmt=fmt;}catch(e){}
  if(!LB_ON){el.textContent='global board lives on the arcade site';return;}
  if(!rows.length){el.textContent='global board: no scores yet — be the first!';return;}
  el.textContent=rows.map((r,i)=>(i+1)+'. '+(r.name||'?')+' — '+fmt(r.value)).join('   ');
}
function lbGate(){
  if(LB_ON&&!lbName()){
    const inp=document.getElementById('arcName'),msg=document.getElementById('arcMsg');
    if(msg)msg.textContent='enter an arcade name first';
    if(inp){try{inp.focus();inp.scrollIntoView({block:'nearest'});}catch(e){}}
    return false;
  }
  return true;
}
function lbWireName(){
  const who=document.getElementById('arcWho'),edit=document.getElementById('arcEdit'),
        inp=document.getElementById('arcName'),save=document.getElementById('arcSave'),
        msg=document.getElementById('arcMsg');
  if(!who||!edit||!inp||!save)return;
  const paint=()=>{
    const n=lbName();
    if(n){who.innerHTML='playing as <b></b> (<a href="#" id="arcChange">change</a>)';who.querySelector('b').textContent=n;edit.style.display='none';
      const ch=document.getElementById('arcChange');if(ch)ch.onclick=e=>{e.preventDefault();edit.style.display='';inp.value=n;if(msg)msg.textContent='';};
    }else{who.textContent=LB_ON?'enter an arcade name to join the global board:':'global board lives on the arcade site';edit.style.display=LB_ON?'':'none';}
  };
  save.onclick=async()=>{if(msg)msg.textContent='checking…';const r=await lbSetName(inp.value);if(r.ok){paint();try{const seat=document.getElementById('name');if(seat&&(!seat.value||seat.value==='Player'))seat.value=lbName();}catch(e){}try{lbRefresh();}catch(e){}}else if(msg)msg.textContent=r.reason==='taken'?'name taken — choose another':'enter 1–12 characters';};
  paint();
}function lbRefresh(){try{const el=document.getElementById('lbLine');if(el){el.textContent='global board: loading…';lbTop(5).then(rows=>lbRender(el,rows,v=>String(v)));}}catch(e){}}
const W=800,H=500,WIN=7,WINCAP=11; // win by 2, hard cap at 11
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('overlay'),scoreEl=document.getElementById('score'),modeEl=document.getElementById('mode'),hintMode=document.getElementById('hintMode'),rallyEl=document.getElementById('rally');
function bumpRally(){rally++;if(rally>maxRally)maxRally=rally;rallyEl.textContent='RALLY '+rally;}
let mode='1p',diff='medium',running=false,paused=false,over=false;
let p1={y:.5,h:90,score:0},p2={y:.5,h:90,score:0};
let ball={x:W/2,y:H/2,vx:0,vy:0,stuck:true,dir:1};
let rally=0;
let maxRally=0;
let keys={},parts=[],trail=[],flash='',flashT=0,countdown=0,countT=0;
let AC=null,muted=false;
try{muted=window.localStorage.getItem('bgames_muted')==='1';}catch(e){}
function saveSharedMute(m){try{window.localStorage.setItem('bgames_muted',m?'1':'0');}catch(e){}}
function refreshMuteBtn(){document.getElementById('muteBtn').innerHTML=muted?ICON_MUTE:ICON_SND;}
const ICON_PAUSE='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
const ICON_SND='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_MUTE='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};}
function beep(f=440,d=.08,t='square',v=.1){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
document.querySelectorAll('#diffRow button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#diffRow button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');diff=b.dataset.d;beep(600,.06);});
document.getElementById('b1p').onclick=()=>{mode='1p';hintMode.textContent='solo vs AI ('+diff+') — you are LEFT, move with W/S or mouse';modeEl.textContent='🤖 singleplayer vs AI ('+diff+')';beep(520,.07);};
document.getElementById('b2p').onclick=()=>{mode='2p';hintMode.textContent='2 players — P1 W/S, P2 arrows';modeEl.textContent='👥 multiplayer local — P1 W/S vs P2 ↑/↓';beep(660,.07);};
document.getElementById('startBtn').onclick=()=>{if(lbGate())start();};
function hideVeil(){document.getElementById('pveil').style.display='none';}
function start(){p1.score=0;p2.score=0;rally=0;maxRally=0;rallyEl.textContent='RALLY 0';p1.h=90;p2.h=90;over=false;running=true;paused=false;hideVeil();targ1=p1.y;targ2=p2.y;ov.style.display='none';modeEl.textContent=mode==='1p'?('🤖 singleplayer vs AI ('+diff+')'):('👥 multiplayer local');resetPoint(ball.dir);countdown=3;countT=performance.now();beep(700,.1);}
const MENU_H1='🏓 PONG DUO';
const MENU_P='Play <b>alone vs AI</b> or <b>2 players, one keyboard</b>. First to 7, win by 2.';
function hideVeil(){document.getElementById('pveil').style.display='none';}
function showMenu(){
  running=false;over=false;paused=false;hideVeil();
  ov.querySelector('h1').textContent=MENU_H1;
  ov.querySelector('p').innerHTML=MENU_P;
  document.getElementById('startBtn').textContent='Start';
  lbRefresh();
  ov.style.display='flex';
}
function openPause(){
  if(!running||over)return;
  const v=document.getElementById('pveil');
  if(v.style.display==='flex')return;
  paused=true;syncPauseIcon();
  document.getElementById('pmuteBtn').textContent='Mute: '+(muted?'on':'off');
  v.style.display='flex';beep(600,.06);
}
function resumeGame(){
  if(!running||over)return;
  paused=false;syncPauseIcon();hideVeil();beep(600,.06);
}
function togglePauseMenu(){
  if(!running||over)return;
  if(document.getElementById('pveil').style.display==='flex')resumeGame();else openPause();
}
function syncPauseIcon(){document.getElementById('pauseBtn').innerHTML=paused?ICON_PLAY:ICON_PAUSE;}
function resetPoint(dir){ball.x=W/2;ball.y=H/2;ball.stuck=true;ball.dir=dir||(Math.random()<.5?-1:1);trail=[];}
function launch(){if(!ball.stuck)return;const a=(Math.random()*.6-.3);const s=400;ball.vx=Math.cos(a)*s*ball.dir;ball.vy=Math.sin(a)*s+(Math.random()<.5?-50:50);ball.stuck=false;beep(880,.12);}
function burst(x,y,c,n=24){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*500,vy:(Math.random()-.5)*500,life:1,color:c});}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();if(k===' '){if(!running||over)return;if(countdown>0)return;if(ball.stuck)launch();else togglePauseMenu();}if(k==='escape'||k==='p')togglePauseMenu();if(k==='m'){muted=!muted;saveSharedMute(muted);refreshMuteBtn();}});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
// 🎮 gamepads: pad0 → P1 (W/S), pad1 → P2 (↑/↓ in 2P); A = launch/pause, Start = pause menu
let _gpA=false,_gpS=false;
function _gpGet(i){try{const gs=navigator.getGamepads?navigator.getGamepads():[];let n=0;for(const g of gs){if(g&&g.connected){if(n===i)return g;n++;}}}catch(e){}return null;}
function gpTick(){
  for(const k of ['w','s','arrowup','arrowdown',' '])if(keys[k+'__gp']){keys[k]=false;keys[k+'__gp']=false;}
  const set=k=>{keys[k]=true;keys[k+'__gp']=true;};
  let a=false,st=false;
  const g0=_gpGet(0);
  if(g0){const ay=g0.axes[1]||0,b=j=>!!(g0.buttons[j]&&g0.buttons[j].pressed);
    if(b(12)||ay<-0.28)set('w');if(b(13)||ay>0.28)set('s');a=a||b(0)||b(7);st=st||b(9);}
  const g1=_gpGet(1);
  if(g1){const ay=g1.axes[1]||0,b=j=>!!(g1.buttons[j]&&g1.buttons[j].pressed);
    if(b(12)||ay<-0.28)set('arrowup');if(b(13)||ay>0.28)set('arrowdown');a=a||b(0)||b(7);st=st||b(9);}
  if(a){set(' ');if(!_gpA)window.dispatchEvent(new KeyboardEvent('keydown',{key:' '}));}
  else if(_gpA)window.dispatchEvent(new KeyboardEvent('keyup',{key:' '}));
  _gpA=a;
  if(st&&!_gpS){window.dispatchEvent(new KeyboardEvent('keydown',{key:'p'}));window.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));}
  _gpS=st;
}
setInterval(gpTick,33);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
function ptrFromClient(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height,left:(cx-r.left)<r.width/2};}
function ptrSide(e){const cx=(e.touches?e.touches[0].clientX:e.clientX);const cy=(e.touches?e.touches[0].clientY:e.clientY);return ptrFromClient(cx,cy);}
let drag=null;
const touchMap=new Map();
let targ1=.5,targ2=.5; // pointer targets — update() glides paddles toward these at the shared speed cap
function moveSide(side,y){y=Math.max(0,Math.min(1,y));if(side==='p1')targ1=y;else targ2=y;}
function stopSide(side){if(side==='p1')targ1=p1.y;else targ2=p2.y;} // pointer released: stop dead, like keyup
cv.addEventListener('mousedown',e=>{const p=ptrSide(e);drag=p.left?'p1':'p2';if(mode==='1p')drag='p1';moveTo(p);if(ball.stuck&&running)launch();});
window.addEventListener('mouseup',()=>{if(drag)stopSide(drag);drag=null;});
cv.addEventListener('mousemove',e=>{if(drag)moveTo(ptrSide(e));});
cv.addEventListener('touchstart',e=>{for(const t of e.changedTouches){const p=ptrFromClient(t.clientX,t.clientY);const side=(mode==='1p')?'p1':(p.left?'p1':'p2');touchMap.set(t.identifier,side);drag=side;moveSide(side,p.y);}if(ball.stuck&&running)launch();e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(touchMap.has(t.identifier)){const p=ptrFromClient(t.clientX,t.clientY);moveSide(touchMap.get(t.identifier),p.y);}}e.preventDefault();},{passive:false});
function endTouch(e){for(const t of e.changedTouches){const s=touchMap.get(t.identifier);touchMap.delete(t.identifier);if(s)stopSide(s);}if(touchMap.size===0)drag=null;else drag=[...touchMap.values()].pop();}
cv.addEventListener('touchend',endTouch);
cv.addEventListener('touchcancel',endTouch);
function moveTo(p){const y=Math.max(0,Math.min(1,p.y));if(drag==='p1')targ1=y;else targ2=y;}
const AI={easy:{sp:.011,err:.09},medium:{sp:.017,err:.045},hard:{sp:.024,err:.015}}[diff]||{sp:.017,err:.045};
let aiTarget=.5,aiTimer=0;
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000);last=t;if(!running||paused)return;update(dt,t);draw(t);}
function update(dt,t){
  if(countdown>0){if(t-countT>650){countT=t;countdown--;beep(440+countdown*90,.1);flash=countdown>0?String(countdown):'GO!';flashT=Date.now()+600;if(countdown===0)launch();}return;}
  const sp=1.7*dt; // shared speed cap per second (≈.028/frame @60Hz) — same feel on 60/120/144/240Hz screens
  if(keys['w'])p1.y-=sp;if(keys['s'])p1.y+=sp;
  if(mode==='2p'){if(keys['arrowup'])p2.y-=sp;if(keys['arrowdown'])p2.y+=sp;}
  // pointer targets glide at the same cap; keyboard owns its paddle outright so re-sync
  // its target (else the glide would fight held keys). AI owns p2 in 1P — leave it alone.
  if(keys['w']||keys['s'])targ1=p1.y;
  if(mode==='1p')targ2=p2.y;else if(keys['arrowup']||keys['arrowdown'])targ2=p2.y;
  p1.y+=Math.sign(targ1-p1.y)*Math.min(Math.abs(targ1-p1.y),sp);
  if(mode==='2p')p2.y+=Math.sign(targ2-p2.y)*Math.min(Math.abs(targ2-p2.y),sp);
  p1.y=Math.max(0,Math.min(1,p1.y));p2.y=Math.max(0,Math.min(1,p2.y));
  // AI
  if(mode==='1p'&&!ball.stuck){
    const cfg={easy:{sp:.011,err:.09},medium:{sp:.018,err:.045},hard:{sp:.026,err:.015}}[diff];
    aiTimer-=dt;
    if(aiTimer<=0){aiTimer=.25;aiTarget=ball.y/H+(Math.random()-.5)*cfg.err*4;}
    if(ball.vx>0){const d=aiTarget-p2.y;const m=Math.sign(d)*Math.min(Math.abs(d),cfg.sp*60*dt);p2.y+=m;}
    else{const d=.5-p2.y;p2.y+=Math.sign(d)*Math.min(Math.abs(d),.5*dt);}
    p2.y=Math.max(0,Math.min(1,p2.y));
  }
  if(ball.stuck){ball.x=(ball.dir<0?120:W-120);ball.y=(ball.dir<0?p1.y:H*p2.y)||H/2;ball.y=(ball.dir<0?p1.y*H:p2.y*H);return;}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.y<10){ball.y=10;ball.vy=Math.abs(ball.vy);}
  if(ball.y>H-10){ball.y=H-10;ball.vy=-Math.abs(ball.vy);}
  const p1x=30,p2x=W-30-14,p1py=p1.y*H,p2py=p2.y*H;
  if(ball.vx<0&&ball.x-8<p1x+14&&ball.x-8>p1x-12&&Math.abs(ball.y-p1py)<p1.h/2+8){
    ball.x=p1x+22;const rel=(ball.y-p1py)/(p1.h/2);const s=Math.min(860,Math.hypot(ball.vx,ball.vy)*1.05+8);
    ball.vx=Math.cos(rel*.9)*s;ball.vy=Math.sin(rel*.9)*s;beep(520,.06);burst(ball.x,ball.y,'#33ff66',10);bumpRally();
  }
  if(ball.vx>0&&ball.x+8>p2x&&ball.x+8<p2x+26&&Math.abs(ball.y-p2py)<p2.h/2+8){
    ball.x=p2x-8;const rel=(ball.y-p2py)/(p2.h/2);const s=Math.min(860,Math.hypot(ball.vx,ball.vy)*1.05+8);
    ball.vx=-Math.cos(rel*.9)*s;ball.vy=Math.sin(rel*.9)*s;beep(620,.06);burst(ball.x,ball.y,'#33ff66',10);bumpRally();
  }
  if(ball.x<-24){scored(2);}else if(ball.x>W+24){scored(1);}
  parts=parts.filter(p=>p.life>0);const dmp=Math.pow(.98,dt*60);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=dmp;p.vy*=dmp;p.life-=dt*1.6;});
}
function scored(w){
  if(w===1)p1.score++;else p2.score++;
  rally=0;rallyEl.textContent='RALLY 0';
  scoreEl.textContent=p1.score+' : '+p2.score;
  beep(w===1?880:220,.25);burst(w===1?60:W-60,H/2,'#33ff66',40);
  flash=p1.score+' — '+p2.score;flashT=Date.now()+900;
  if(((p1.score>=WIN||p2.score>=WIN)&&Math.abs(p1.score-p2.score)>=2)||p1.score>=WINCAP||p2.score>=WINCAP){gameOver(w);return;}
  ball.dir=w===1?-1:1;ball.stuck=true;
  setTimeout(()=>{if(running&&!over){resetPoint(ball.dir);countdown=0;launch();}},900);
  ball.vx=ball.vy=0;ball.x=W/2;
}
function gameOver(w){
  over=true;running=false;hideVeil();
  ov.style.display='flex';
  const champ=mode==='1p'?(w===1?'YOU WIN! 🏆':'AI WINS 🤖'):(w===1?'PLAYER 1 WINS! 🏆':'PLAYER 2 WINS! 🏆');
  ov.querySelector('h1').textContent=champ;
  ov.querySelector('p').innerHTML='Final: <b>'+p1.score+' : '+p2.score+'</b> • mode: '+(mode==='1p'?'solo vs '+diff:'2P local')+'<br>Pick a mode and hit Start.';
  document.getElementById('startBtn').textContent='Play again';
  try{lbPost(maxRally);}catch(e){}
  lbRefresh();
}
function draw(t){
  ctx.fillStyle='#030a06';ctx.fillRect(0,0,W,H);
  // watermark broadcast numerals behind play
  ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#fff';ctx.font='900 200px ui-monospace,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p1.score,W*0.25,H/2);ctx.fillText(p2.score,W*0.75,H/2);ctx.restore();
  ctx.strokeStyle='#ffffff0d';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  // net mesh instead of a plain dashed line
  ctx.save();ctx.strokeStyle='#2f7a44';ctx.lineWidth=2;ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#1a4a28';ctx.lineWidth=1;
  for(let y=10;y<H;y+=26){ctx.beginPath();ctx.moveTo(W/2-7,y);ctx.lineTo(W/2-7,y+13);ctx.stroke();ctx.beginPath();ctx.moveTo(W/2+7,y);ctx.lineTo(W/2+7,y+13);ctx.stroke();}
  ctx.restore();
  trail.push({x:ball.x,y:ball.y});if(trail.length>16)trail.shift();
  trail.forEach((p,i)=>{ctx.globalAlpha=i/trail.length*.45;ctx.fillStyle='#33ff66';ctx.beginPath();ctx.arc(p.x,p.y,3+6*i/trail.length,0,7);ctx.fill();});ctx.globalAlpha=1;
  paddle(30,p1.y*H,'#33ff66');paddle(W-30-14,p2.y*H,'#33ff66');
  // flat phosphor ball with motion ticks (no glow)
  ctx.save();ctx.fillStyle='#33ff66';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();
  ctx.strokeStyle='#04331a';ctx.lineWidth=2;
  const bsp=Math.hypot(ball.vx,ball.vy);
  if(bsp>50){const dx=-ball.vx/bsp,dy=-ball.vy/bsp;for(let k=1;k<=3;k++){ctx.beginPath();ctx.moveTo(ball.x+dx*(10+k*9),ball.y+dy*(10+k*9));ctx.lineTo(ball.x+dx*(16+k*9),ball.y+dy*(16+k*9));ctx.stroke();}}
  ctx.restore();
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);});ctx.globalAlpha=1;
  if(Date.now()<flashT){ctx.save();ctx.textAlign='center';ctx.font='900 60px ui-monospace,Menlo,monospace';ctx.fillStyle='#fff';ctx.fillText(flash,W/2,H/2-10);ctx.restore();}
  else if(countdown>0){ctx.save();ctx.textAlign='center';ctx.font='900 72px ui-monospace,Menlo,monospace';ctx.fillStyle='#fff';ctx.fillText(countdown,W/2,H/2);ctx.restore();}
  else if(ball.stuck&&running){ctx.save();ctx.textAlign='center';ctx.font='700 18px system-ui';ctx.fillStyle='#ffffffaa';ctx.fillText(mode==='1p'?'Space / tap to launch':'Space / tap to launch',W/2,70);ctx.restore();}
}
function paddle(x,y,c){ctx.save();ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y-45,14,90,7);ctx.fill();ctx.fillStyle='#10131c';ctx.fillRect(x,y-45,14,10);ctx.fillRect(x,y+35,14,10);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x+5,y-25,4,50);ctx.restore();}
document.getElementById('pauseBtn').onclick=e=>{e.stopPropagation();togglePauseMenu();beep(600,.06);};
document.getElementById('menuBtn').onclick=e=>{e.stopPropagation();togglePauseMenu();beep(600,.06);};
document.getElementById('resumeBtn').onclick=e=>{e.stopPropagation();resumeGame();};
document.getElementById('restartBtn').onclick=e=>{e.stopPropagation();hideVeil();start();beep(700,.1);};
document.getElementById('quitBtn').onclick=e=>{e.stopPropagation();showMenu();beep(500,.06);};
document.getElementById('pmuteBtn').onclick=e=>{e.stopPropagation();muted=!muted;saveSharedMute(muted);refreshMuteBtn();document.getElementById('pmuteBtn').textContent='Mute: '+(muted?'on':'off');if(!muted)beep(700,.07);};
document.getElementById('muteBtn').onclick=e=>{e.stopPropagation();muted=!muted;saveSharedMute(muted);refreshMuteBtn();if(!muted)beep(700,.07);};
refreshMuteBtn();
lbWireName();
lbRefresh();
if(isTouch){document.getElementById('hintMode').textContent='touch: drag left/right half (2P = two fingers)';}
requestAnimationFrame(loop);draw(performance.now());
</script>
</body>
</html>
